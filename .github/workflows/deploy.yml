# .github/workflows/deploy-s3-only.yml

name: Deploy File

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: ap-south-1
  NODE_VERSION: '18'
  
  # Update with your actual values
  ECR_REPOSITORY: 487148038913.dkr.ecr.ap-south-1.amazonaws.com/meeting-ai-backend
  LAMBDA_FUNCTION_NAME: AI-summarizer
  S3_BUCKET: meeting-ai-frontend-anoushka
  # No CloudFront needed!

jobs:
  test:
    name: Test Applications
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Test Backend
      run: |
        cd backend
        npm ci
        echo "✅ Backend dependencies installed"

    - name: Test Frontend Build
      run: |
        cd frontend
        npm ci
        npm run build
        echo "✅ Frontend build successful"

  deploy-backend:
    name: Deploy Backend to Lambda
    runs-on: ubuntu-latest
    needs: test
    
    outputs:
      api-url: ${{ steps.get-api-url.outputs.url }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and push Docker image
      run: |
        cd backend
        docker build -t $ECR_REPOSITORY:latest .
        docker push $ECR_REPOSITORY:latest

    - name: Update Lambda function
      run: |
        aws lambda update-function-code \
          --function-name $LAMBDA_FUNCTION_NAME \
          --image-uri $ECR_REPOSITORY:latest
        
        aws lambda update-function-configuration \
          --function-name $LAMBDA_FUNCTION_NAME \
          --environment Variables="{GROQ_API_KEY=${{ secrets.GROQ_API_KEY }},GMAIL_USER=${{ secrets.GMAIL_USER }},GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }},NODE_ENV=lambda}"

    - name: Get API Gateway URL
      id: get-api-url
      run: |
        # Get the API Gateway URL (you'll set this manually)
        echo "url=https://your-api-id.execute-api.us-east-1.amazonaws.com" >> $GITHUB_OUTPUT

  deploy-frontend:
    name: Deploy Frontend to S3
    runs-on: ubuntu-latest
    needs: [test, deploy-backend]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Build React app with API URL
      run: |
        cd frontend
        npm ci
        # Set API URL for production
        echo "REACT_APP_API_URL=${{ needs.deploy-backend.outputs.api-url }}" > .env.production
        npm run build

    - name: Deploy to S3
      run: |
        cd frontend
        aws s3 sync ./dist/ s3://$S3_BUCKET/ --delete

    - name: Get S3 website URL
      run: |
        echo "🚀 Frontend deployed!"
        echo "Website URL: http://$S3_BUCKET.s3-website-$AWS_REGION.amazonaws.com"

